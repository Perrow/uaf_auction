    <virtualhost *:80>
        ServerName uaf.tmoz.no-ip.org
     
        WSGIDaemonProcess uaf user=kristian group=kristian threads=5 home=/home/kristian/UAF_auktion
        WSGIScriptAlias / /home/kristian/UAF_auktion/uaf.wsgi
     
        <directory /home/kristian/UAF_auktion>
            WSGIProcessGroup uaf
            WSGIApplicationGroup %{GLOBAL}
            WSGIScriptReloading On
            Order deny,allow
            Allow from all
        </directory>
    </virtualhost>
