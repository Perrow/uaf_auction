{% extends "base.html" %}
{% block title %}Registrera poster för annan användare{% endblock %}
{% block body %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-xl-10">
            <h1 class="h2 mb-4">Registrera poster för annan användare</h1>

            <form id="register_form" action="{{ url_for('admin_register_many_posts') }}" method="POST" novalidate>
                <section id="create_posts" class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label" for="seller_select">Säljare</label>
                                <select id="seller_select" name="seller_select" class="form-select">
                                    {% for seller in sellers %}
                                        <option value="{{ seller[0] }}">{{ seller[1] }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="numberofposts">Antal poster</label>
                                <input class="form-control" id="numberofposts" name="numberofposts" type="number" min="1" step="1">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="master_type">Förvald godstyp</label>
                                {% autoescape false %}
                                    {{ select }}
                                {% endautoescape %}
                            </div>
                            <div class="col-12 col-md-auto d-grid">
                                <button id="addbutton" type="button" class="btn btn-primary">Skapa poster</button>
                            </div>
                        </div>
                        <div id="create_error" class="text-danger mt-2" aria-live="polite"></div>
                    </div>
                </section>

                <div id="form_elements" class="d-grid gap-3"></div>

                <div id="form_actions" class="mt-4 d-none">
                    <div id="msg" class="mb-3" aria-live="polite"></div>
                    <button id="submit" name="submit" type="submit" class="btn btn-primary">Registrera poster</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/register_many.js') }}"></script>
{% endblock %}
