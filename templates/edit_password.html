{% extends "base.html" %}
{% block title %} Ändra lösenord {% endblock %}
{% block body %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Ändra lösenord för {{ name }}</h1>
                    <form action="" method="POST">
                        <input type="hidden" value="{{ seller_id }}" name="seller_id">
                        <div class="mb-3">
                            <label class="form-label" for="password">Nytt lösenord</label>
                            <div class="input-group">
                                <input type="password" name="password" id="password" class="form-control" autocomplete="new-password" required>
                                <button type="button" class="btn btn-outline-secondary" data-password-toggle="password" aria-pressed="false">Visa</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Spara lösenord</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password_toggle.js') }}"></script>
{% endblock %}
