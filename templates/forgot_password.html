{% extends "base.html" %}
{% block title %}Glömt lösenord{% endblock %}
{% block body %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Glömt lösenord</h1>
                    <p class="text-body-secondary">Ange e-postadressen som är registrerad på kontot.</p>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label" for="email">E-postadress</label>
                            <input class="form-control"
                                   type="email"
                                   id="email"
                                   name="email"
                                   autocomplete="email"
                                   required>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-primary" type="submit">Skicka återställningslänk</button>
                            <a class="btn btn-outline-secondary" href="{{ url_for('login') }}">Tillbaka till inloggning</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
