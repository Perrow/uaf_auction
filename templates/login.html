{% extends "base.html" %}
{% block title %} Logga in {% endblock %}
{% block body %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Logga in</h1>
                    <p class="text-body-secondary">Logga in för att komma åt alla sidor.</p>
                    <form action="" method="POST">
                        <div class="mb-3">
                            <label class="form-label" for="username">E-postadress</label>
                            <input type="email" name="username" id="username" class="form-control" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Lösenord</label>
                            <div class="input-group">
                                <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
                                <button type="button" class="btn btn-outline-secondary" data-password-toggle="password" aria-pressed="false">Visa</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Logga in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password_toggle.js') }}"></script>
{% endblock %}
