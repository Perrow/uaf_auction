{% extends "base.html" %}
{% block title %}Redigera post{% endblock %}
{% block body %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <h1 class="h2 mb-4">Redigera post</h1>

            <form id="edit_post_form" action="" method="POST" novalidate>
                <input type="hidden" value="{{ data[0] }}" name="post_id">

                <div class="mb-3">
                    <label class="form-label" for="master_type">Godstyp</label>
                    {% autoescape false %}
                        {{ select }}
                    {% endautoescape %}
                </div>

                <div class="mb-3">
                    <label class="form-label" for="sciname_id">Vetenskapligt namn</label>
                    <input class="form-control" id="sciname_id" name="sciname" type="text" value="{{ data[1] }}">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="popname_id">Populärnamn</label>
                    <input class="form-control" id="popname_id" name="popname" type="text" value="{{ data[2] }}">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6" id="min_price_div_id">
                        <label class="form-label" for="min_price_id">Frivilligt reservationspris</label>
                        <input class="form-control min_price_input" id="min_price_id" name="min_price" type="number" min="0" step="1" value="{{ data[5] }}">
                        <div id="min_price_error_id" class="invalid-feedback d-block"></div>
                    </div>
                    <div class="col-md-6" id="fixed_price_div_id">
                        <label class="form-label" for="fixed_price_id">Fast pris</label>
                        <input class="form-control fixed_price_input" id="fixed_price_id" name="fixed_price" type="number" min="0" step="1" value="{{ data[6] }}">
                        <div id="fixed_price_error_id" class="invalid-feedback d-block"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="description_id">Beskrivning</label>
                    <input class="form-control" id="description_id" name="description" type="text" value="{{ data[3] }}" maxlength="100">
                    <div class="form-text">Ange gärna antal, färg eller annat intressant.</div>
                </div>

                <div id="msg" class="mb-3" aria-live="polite"></div>
                <div class="d-flex flex-wrap gap-2 justify-content-between">
                    <button id="submit" name="submit" type="submit" class="btn btn-primary">Spara ändringar</button>
                    <a class="btn btn-danger"
                       href="{{ url_for('delete_post') }}/{{ data[0] }}"
                       onclick="return confirm('Vill du verkligen ta bort post {{ data[0] }}?');">
                        <i class="fa fa-trash" aria-hidden="true"></i> Ta bort
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/edit_post.js') }}"></script>
{% endblock %}
