{% extends "base.html" %}
{% block title %} Editera post {% endblock %}
{% block head %}
{{ super() }}
{% endblock %}
{% block body %}
<h1> Editera post </h1>
<form action="" method="POST">
    <input type="hidden" value="{{ data[0]}}" name="post_id" />

    <div class="row">
        <div class="col-sm-2">
            {% autoescape false %}
            {{ select }}
            {% endautoescape %}
        </div>
    </div>
    <br>

    <div class="row">
        <div class="col-sm-5">
            <label class="control-label" for="sciname_id">Vetenskapligt namn:</label><br>
            <input class="form-control" id="sciname_id" name="sciname" type="text" value="{{ data[1]}}"> <br>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-5">
            <label class="control-label" for="popname_id">Populärnamn:</label><br>
            <input class="form-control" id="popname_id" name="popname" type="text" value="{{ data[2]}}"> <br>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-2" id="min_price_div_id">
            <label class="control-label" for="min_price_id">Frivilligt reservationspris:</label>
            <div id="min_price_error_id" class="error"></div>
            <input class="form-control min_price_input" id="min_price_id" name="min_price" type="text" value="{{ data[5]}}">
            <br>
        </div>
        <div class="col-sm-2" id="fixed_price_div_id" class="left ten ">
            <label class="control-label" for="fixed_price_id">Fast pris:</label>
            <div id="fixed_price_error_id" class="error"></div>
            <input class="form-control fixed_price_input" id="fixed_price_id" name="fixed_price" type="text"
                   value="{{ data[6]}}">
            <br>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <label class="control-label" for="description_id">Beskrivning, ange gärna antal, färg eller annat intressant:</label><br>
            <input class="form-control" id="description_id" name="description" type="text" value="{{ data[3]}}"> <br>
        </div>

    </div>

    <div class="row">
        <div class="col-sm-2">
            <input id="submit" name="submit" type="submit" value="Skicka" class="btn btn-primary">
        </div>
    </div>
</form>

<script src="{{ url_for('static', filename='js/edit_post.js') }}"></script>
{% endblock %}
