{% extends "base.html" %}
{% block title %} Om {% endblock %}
{% block head %}
    {{ super() }}
    <script src="{{ url_for('static', filename='js/dygraph.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/dygraph.css') }}" rel="stylesheet">
{% endblock %}
{% block body %}
    <div class="container">
        <div class="row">
            <div id="auction_plot" style="width:100%; height:400px;"></div>
        </div>
        <br>
        <div class="row">
            <div id="fleamarket_plot" style="width:100%; height:400px;"></div>
        </div>
        <script type="text/javascript">
            function barChartPlotter(e) {  // This cutom plotter comes from http://dygraphs.com/tests/plotters.html
                var ctx = e.drawingContext;
                var points = e.points;
                var y_bottom = e.dygraph.toDomYCoord(0);

                ctx.fillStyle = e.color;

                // Find the minimum separation between x-values.
                // This determines the bar width.
                var min_sep = Infinity;
                for (var i = 1; i < points.length; i++) {
                    var sep = points[i].canvasx - points[i - 1].canvasx;
                    if (sep < min_sep) min_sep = sep;
                }
                var bar_width = Math.floor(2.0 / 3 * min_sep);

                // Do the actual plotting.
                for (var i = 0; i < points.length; i++) {
                    var p = points[i];
                    var center_x = p.canvasx;

                    ctx.fillRect(center_x - bar_width / 2, p.canvasy,
                        bar_width, y_bottom - p.canvasy);

                    ctx.strokeRect(center_x - bar_width / 2, p.canvasy,
                        bar_width, y_bottom - p.canvasy);
                }
            }

            g2 = new Dygraph(
                document.getElementById("auction_plot"),
                {{ plot_data_auction | safe}}
                {
                    rollPeriod: 1,
                    title: 'Antal poster sålda på auktion varje minut ',
                    ylabel: 'Antal',
                    legend: 'always',
                    labelsDivStyles: {'textAlign': 'right'},
                    plotter: barChartPlotter
                }
            );

            g2 = new Dygraph(
                document.getElementById("fleamarket_plot"),
                {{ plot_data_fleamarket | safe}}
                {
                    rollPeriod: 1,
                    title: 'Antal poster sålda på fastabordet varje minut ',
                    ylabel: 'Antal',
                    legend: 'always',
                    labelsDivStyles: {'textAlign': 'right'},
                    plotter: barChartPlotter
                }
            );
        </script>

    </div>
{% endblock %}
