{% extends "base.html" %}
{% block title %} Försäljningsstatistik {% endblock %}
{% block styles %}
    <link href="{{ url_for('static', filename='css/dygraph.css') }}" rel="stylesheet">
{% endblock %}
{% block body %}
<div class="container py-4">
    <div class="mb-4">
        <h1 class="mb-1">Försäljningsstatistik</h1>
        <p class="text-body-secondary mb-0">Försäljning per minut för auktion och fasta bordet.</p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div id="auction_plot" style="width:100%; height:400px;"></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div id="fleamarket_plot" style="width:100%; height:400px;"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
    <script src="{{ url_for('static', filename='js/dygraph.min.js') }}"></script>
    <script>
        function barChartPlotter(e) {
            const ctx = e.drawingContext;
            const points = e.points;
            const yBottom = e.dygraph.toDomYCoord(0);

            ctx.fillStyle = e.color;

            let minSep = Infinity;
            for (let i = 1; i < points.length; i++) {
                const sep = points[i].canvasx - points[i - 1].canvasx;
                if (sep < minSep) minSep = sep;
            }
            const barWidth = Math.floor(2.0 / 3 * minSep);

            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const centerX = p.canvasx;
                ctx.fillRect(centerX - barWidth / 2, p.canvasy, barWidth, yBottom - p.canvasy);
                ctx.strokeRect(centerX - barWidth / 2, p.canvasy, barWidth, yBottom - p.canvasy);
            }
        }

        new Dygraph(
            document.getElementById('auction_plot'),
            {{ plot_data_auction | safe}}
            {
                rollPeriod: 1,
                title: 'Antal poster sålda på auktion varje minut',
                ylabel: 'Antal',
                legend: 'always',
                labelsDivStyles: {'textAlign': 'right'},
                plotter: barChartPlotter
            }
        );

        new Dygraph(
            document.getElementById('fleamarket_plot'),
            {{ plot_data_fleamarket | safe}}
            {
                rollPeriod: 1,
                title: 'Antal poster sålda på fastabordet varje minut',
                ylabel: 'Antal',
                legend: 'always',
                labelsDivStyles: {'textAlign': 'right'},
                plotter: barChartPlotter
            }
        );
    </script>
{% endblock %}
