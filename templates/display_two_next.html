<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nästa post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', _eternal=True) }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
</head>
<body class="bg-body-tertiary">
<main class="container-fluid px-4 py-4">
    <div class="mb-3 text-body-secondary">Nästa post på Display two</div>

    <section class="bg-white rounded-3 shadow-sm p-4 p-lg-5">
        <div class="row align-items-baseline g-3 mb-3">
            <div class="col-md-6">
                <div id="next_post_id" class="display-3 fw-bold"></div>
            </div>
            <div class="col-md-6 text-md-end">
                <div id="next_min_price" class="display-5 fw-semibold"></div>
            </div>
        </div>

        <div id="next_plain_name" class="display-4 fw-semibold mb-2"></div>
        <div id="next_scientific_name" class="display-5 fst-italic mb-3"></div>
        <div id="next_description" class="fs-2 mb-3"></div>
        <div id="next_seller_name" class="fs-3 text-body-secondary"></div>
        <div id="next_type" class="alert alert-warning mt-3 mb-0 d-none"></div>
        <div id="next_sold" class="alert alert-danger mt-3 mb-0 d-none"></div>
        <div id="next_empty" class="alert alert-secondary mt-3 mb-0">Ingen nästa post vald.</div>
    </section>
</main>

<script src="{{ url_for('static', filename='js/display_two_next.js') }}"></script>
</body>
</html>
